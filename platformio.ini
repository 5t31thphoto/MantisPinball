; ============================================================================
;  PlatformIO project for LilyGo T-Display-S3
;  Pinball-S3  -  dual-button arcade pinball
;
;  Board: LilyGo T-Display-S3 (16 MB flash, NO PSRAM -
;         PSRAM disabled to prevent OPI init crash. 1.9-inch 170x320 ST7789)
;
;  IMPORTANT: We pin platform = espressif32 @ 6.5.0 because that bundles
;  Arduino-ESP32 core 2.0.x. TFT_eSPI's 8-bit-parallel path on the S3 is
;  known to break with Arduino-ESP32 core 3.x. If you bump the platform
;  version, retest the display before assuming everything still works.
; ============================================================================

[env:lilygo-t-display-s3]
platform        = espressif32 @ 6.5.0
board           = lilygo-t-display-s3
framework       = arduino

monitor_speed   = 115200
upload_speed    = 921600
upload_protocol = esptool

; --- Memory layout ----------------------------------------------------------
; The board JSON already sets default_16MB.csv partitions and 16 MB flash, but
; we restate them here so the build is self-documenting.
board_build.partitions          = partitions_16MB_pinball.csv
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.filesystem          = littlefs

; --- Library dependencies ---------------------------------------------------
; Pinned to a known-good TFT_eSPI release.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0

; --- Build flags ------------------------------------------------------------
;
; The TFT_eSPI block below is the contents of Setup206_LilyGo_T_Display_S3.h
; expressed as -D flags. By defining USER_SETUP_LOADED, TFT_eSPI's
; User_Setup_Select.h dispatcher is skipped entirely, so we don't need to
; edit any library files - the configuration travels with the project.
;
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DPAJ7620_I2C_SDA=43
    -DPAJ7620_I2C_SCL=44

    ; ---- TFT_eSPI: equivalent of Setup206_LilyGo_T_Display_S3.h -----------
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_ID=206
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Stage web-flasher parts + a merged image after every build (see merge_bin.py)
extra_scripts = post:merge_bin.py
